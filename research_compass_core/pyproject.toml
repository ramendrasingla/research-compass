[project]
name = "research_compass_core"
version = "1.0.0"
description = "Streamlined research agent using OpenAI and ArXiv - minimal dependencies version"
authors = [
    { name = "Research Compass Team" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.5.4",
    "langchain-community>=0.3.9",
    "langchain-openai>=0.3.28",
    "openai>=1.99.2",
    "arxiv>=2.1.3",
    "pymupdf>=1.25.3",
    "python-dotenv>=1.0.1",
    "pytest",
    "httpx>=0.24.0",
    "rich>=13.0.0",
    "langgraph-cli[inmem]>=0.3.1",
    "langsmith>=0.3.37",
    "markdown>=3.5",
    "weasyprint>=60.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["research_compass_core"]

[tool.setuptools.package-dir]
"research_compass_core" = "src/research_compass_core"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
